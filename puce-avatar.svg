<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="220" height="180">
<defs>
  <style>
    /* ── Marche ── */
    .body    { animation: body-walk   0.6s ease-in-out infinite; transform-origin: 110px 110px; }
    .head    { animation: head-walk   0.6s ease-in-out infinite; transform-origin: 80px 70px; }
    .leg-fl  { animation: leg-fl      0.6s ease-in-out infinite; transform-origin: 82px 130px; }
    .leg-fr  { animation: leg-fr      0.6s ease-in-out infinite; transform-origin: 90px 130px; }
    .leg-bl  { animation: leg-bl      0.6s ease-in-out infinite; transform-origin: 138px 130px; }
    .leg-br  { animation: leg-br      0.6s ease-in-out infinite; transform-origin: 145px 130px; }
    .tail    { animation: tail-walk   1.2s ease-in-out infinite; transform-origin: 165px 112px; }
    .shadow  { animation: shadow-walk 0.6s ease-in-out infinite; transform-origin: 110px 165px; }
    .walk    { animation: walk-move   3s linear infinite; }

    @keyframes body-walk {
      0%,100%{ transform: translateY(0px) rotate(0deg); }
      25%    { transform: translateY(-3px) rotate(-1deg); }
      75%    { transform: translateY(-3px) rotate(1deg); }
    }
    @keyframes head-walk {
      0%,100%{ transform: rotate(0deg) translateY(0); }
      25%    { transform: rotate(-3deg) translateY(-2px); }
      75%    { transform: rotate(3deg) translateY(-2px); }
    }
    @keyframes leg-fl {
      0%    { transform: rotate(-28deg); }
      25%   { transform: rotate(28deg); }
      50%   { transform: rotate(10deg); }
      75%   { transform: rotate(-10deg); }
      100%  { transform: rotate(-28deg); }
    }
    @keyframes leg-fr {
      0%    { transform: rotate(20deg); }
      25%   { transform: rotate(-20deg); }
      50%   { transform: rotate(-8deg); }
      75%   { transform: rotate(8deg); }
      100%  { transform: rotate(20deg); }
    }
    @keyframes leg-bl {
      0%    { transform: rotate(22deg); }
      25%   { transform: rotate(-22deg); }
      50%   { transform: rotate(-8deg); }
      75%   { transform: rotate(8deg); }
      100%  { transform: rotate(22deg); }
    }
    @keyframes leg-br {
      0%    { transform: rotate(-22deg); }
      25%   { transform: rotate(22deg); }
      50%   { transform: rotate(8deg); }
      75%   { transform: rotate(-8deg); }
      100%  { transform: rotate(-22deg); }
    }
    @keyframes tail-walk {
      0%,100%{ transform: rotate(10deg); }
      50%    { transform: rotate(-15deg); }
    }
    @keyframes shadow-walk {
      0%,100%{ transform: scaleX(1)   scaleY(1); }
      25%    { transform: scaleX(0.92) scaleY(0.85); }
      75%    { transform: scaleX(0.92) scaleY(0.85); }
    }
    @keyframes walk-move {
      0%   { transform: translateX(30px); }
      50%  { transform: translateX(-10px); }
      100% { transform: translateX(30px); }
    }
  </style>

  <radialGradient id="gBody" cx="38%" cy="30%" r="62%">
    <stop offset="0%"   stop-color="#2e2e2e"/>
    <stop offset="55%"  stop-color="#141414"/>
    <stop offset="100%" stop-color="#060606"/>
  </radialGradient>
  <radialGradient id="gBelly" cx="45%" cy="35%" r="60%">
    <stop offset="0%"  stop-color="#f5f5f0"/>
    <stop offset="100%" stop-color="#dcdcd5"/>
  </radialGradient>
  <radialGradient id="gHead" cx="36%" cy="28%" r="64%">
    <stop offset="0%"   stop-color="#2a2a2a"/>
    <stop offset="60%"  stop-color="#111"/>
    <stop offset="100%" stop-color="#050505"/>
  </radialGradient>
  <radialGradient id="gMuzzle" cx="42%" cy="32%" r="60%">
    <stop offset="0%"  stop-color="#f0efe8"/>
    <stop offset="100%" stop-color="#d8d8d0"/>
  </radialGradient>
  <radialGradient id="gEye" cx="35%" cy="28%" r="65%">
    <stop offset="0%"  stop-color="#ffdd44"/>
    <stop offset="55%" stop-color="#cc9900"/>
    <stop offset="100%" stop-color="#886600"/>
  </radialGradient>
  <radialGradient id="gInEar" cx="50%" cy="45%" r="62%">
    <stop offset="0%"  stop-color="#ff99bb"/>
    <stop offset="100%" stop-color="#cc3366"/>
  </radialGradient>
  <radialGradient id="gLeg" cx="40%" cy="20%" r="70%">
    <stop offset="0%"  stop-color="#222"/>
    <stop offset="100%" stop-color="#0a0a0a"/>
  </radialGradient>
  <filter id="drop3d">
    <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#00000044"/>
  </filter>
  <filter id="soft">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00000033"/>
  </filter>
</defs>

<g class="walk">

<!-- OMBRE AU SOL -->
<g class="shadow">
  <ellipse cx="110" cy="165" rx="58" ry="8" fill="#00000022"/>
</g>

<!-- ── JAMBES ARRIÈRE (dessinées en premier = derrière) ── -->
<g class="leg-br" filter="url(#soft)">
  <!-- cuisse -->
  <ellipse cx="145" cy="128" rx="8" ry="16" fill="#0d0d0d" transform="rotate(5,145,128)"/>
  <!-- bas de jambe -->
  <rect x="140" y="140" width="10" height="18" rx="5" fill="#0d0d0d"/>
  <!-- patte -->
  <ellipse cx="145" cy="158" rx="9" ry="5" fill="#151515"/>
</g>
<g class="leg-bl" filter="url(#soft)">
  <ellipse cx="138" cy="127" rx="9" ry="17" fill="#1a1a1a" transform="rotate(-3,138,127)"/>
  <rect x="133" y="139" width="11" height="19" rx="5" fill="#1a1a1a"/>
  <ellipse cx="138" cy="158" rx="10" ry="5.5" fill="#222"/>
</g>

<!-- ── CORPS ── -->
<g class="body" filter="url(#drop3d)">
  <!-- Corps noir principal -->
  <ellipse cx="115" cy="115" rx="55" ry="36" fill="url(#gBody)"/>
  <!-- Highlight 3D côté haut -->
  <ellipse cx="105" cy="100" rx="30" ry="12" fill="#2a2a2a" opacity="0.6"/>
  <!-- Ventre blanc -->
  <ellipse cx="108" cy="122" rx="32" ry="22" fill="url(#gBelly)"/>
</g>

<!-- ── QUEUE ── -->
<g class="tail">
  <path d="M165 112 C178 100 190 88 186 72 C183 60 174 58 170 65
           C176 70 178 82 172 96 C168 105 165 110 165 112Z"
        fill="url(#gBody)" stroke="#050505" stroke-width="0.5"/>
  <!-- bout blanc queue -->
  <ellipse cx="170" cy="65" rx="6" ry="8" fill="url(#gBelly)" transform="rotate(-18,170,65)"/>
</g>

<!-- ── JAMBES AVANT (devant le corps) ── -->
<g class="leg-fr" filter="url(#soft)">
  <ellipse cx="90" cy="127" rx="8" ry="16" fill="#111" transform="rotate(4,90,127)"/>
  <rect x="85" y="138" width="10" height="19" rx="5" fill="#111"/>
  <ellipse cx="90" cy="157" rx="9" ry="5" fill="#181818"/>
</g>
<g class="leg-fl" filter="url(#soft)">
  <ellipse cx="82" cy="126" rx="9" ry="17" fill="#1c1c1c" transform="rotate(-4,82,126)"/>
  <rect x="77" y="137" width="11" height="20" rx="5" fill="#1c1c1c"/>
  <!-- patte blanche avant -->
  <ellipse cx="82" cy="157" rx="10" ry="5.5" fill="url(#gBelly)"/>
</g>

<!-- ── TÊTE ── -->
<g class="head" filter="url(#drop3d)">
  <!-- Tête noire ronde -->
  <circle cx="72" cy="72" r="36" fill="url(#gHead)"/>
  <!-- Highlight 3D -->
  <ellipse cx="62" cy="60" rx="16" ry="12" fill="#252525" opacity="0.5"/>

  <!-- Museau blanc/crème -->
  <ellipse cx="72" cy="82" rx="20" ry="16" fill="url(#gMuzzle)"/>
  <!-- Joues blanches -->
  <ellipse cx="50" cy="76" rx="14" ry="11" fill="url(#gMuzzle)"/>
  <ellipse cx="94" cy="76" rx="14" ry="11" fill="url(#gMuzzle)"/>

  <!-- OREILLES -->
  <!-- oreille gauche -->
  <path d="M46 52 L34 16 L64 40 Z" fill="url(#gHead)"/>
  <path d="M48 50 L38 22 L61 40 Z" fill="url(#gInEar)" opacity="0.85"/>
  <!-- oreille droite -->
  <path d="M98 52 L108 16 L80 40 Z" fill="url(#gHead)"/>
  <path d="M96 50 L104 22 L79 40 Z" fill="url(#gInEar)" opacity="0.85"/>

  <!-- YEUX -->
  <!-- oeil gauche -->
  <ellipse cx="60" cy="70" rx="10" ry="11" fill="url(#gEye)"/>
  <ellipse cx="60" cy="71" rx="5.5" ry="9" fill="#0a0a0a"/>
  <circle  cx="56" cy="66" r="3" fill="white" opacity="0.9"/>
  <ellipse cx="60" cy="70" rx="10" ry="11" fill="none" stroke="#050505" stroke-width="2"/>
  <!-- oeil droit -->
  <ellipse cx="84" cy="70" rx="10" ry="11" fill="url(#gEye)"/>
  <ellipse cx="84" cy="71" rx="5.5" ry="9" fill="#0a0a0a"/>
  <circle  cx="80" cy="66" r="3" fill="white" opacity="0.9"/>
  <ellipse cx="84" cy="70" rx="10" ry="11" fill="none" stroke="#050505" stroke-width="2"/>

  <!-- NEZ -->
  <path d="M69 85 Q72 82 75 85 Q72 89 69 85Z" fill="#dd4466" stroke="#aa2244" stroke-width="0.5"/>
  <line x1="72" y1="89" x2="72" y2="93" stroke="#cc3355" stroke-width="1"/>
  <!-- Bouche sourire -->
  <path d="M72 93 Q66 99 61 97" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M72 93 Q78 99 83 97" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- MOUSTACHES -->
  <line x1="12" y1="76" x2="52" y2="80" stroke="white" stroke-width="1.1" opacity="0.85"/>
  <line x1="14" y1="82" x2="52" y2="82" stroke="white" stroke-width="1.1" opacity="0.85"/>
  <line x1="14" y1="88" x2="52" y2="84" stroke="white" stroke-width="1.1" opacity="0.85"/>
  <line x1="92" y1="80" x2="132" y2="76" stroke="white" stroke-width="1.1" opacity="0.85"/>
  <line x1="92" y1="82" x2="130" y2="82" stroke="white" stroke-width="1.1" opacity="0.85"/>
  <line x1="92" y1="84" x2="128" y2="88" stroke="white" stroke-width="1.1" opacity="0.85"/>
</g>

</g><!-- end walk -->
</svg>
