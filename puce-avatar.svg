<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <defs>
    <style>
      .ear-l  { transform-origin: 55px 35px;  animation: ear-l 6s ease-in-out infinite 2s; }
      .ear-r  { transform-origin: 145px 35px; animation: ear-r 6s ease-in-out infinite 2.5s; }
      .eye-l  { transform-origin: 76px 88px;  animation: blink 5s ease-in-out infinite 1.5s; }
      .eye-r  { transform-origin: 124px 88px; animation: blink 5s ease-in-out infinite 1.5s; }
      .tail   { transform-origin: 152px 185px; animation: tail 3s ease-in-out infinite; }
      .body   { animation: breathe 4s ease-in-out infinite; transform-origin: 100px 170px; }
      .whl    { transform-origin: 78px 120px; animation: wh 3.5s ease-in-out infinite; }
      .whr    { transform-origin: 122px 120px; animation: wh 3.5s ease-in-out infinite .7s; }
      .float  { animation: float 4s ease-in-out infinite; }

      @keyframes ear-l  { 0%,78%,100%{transform:rotate(0)} 82%{transform:rotate(-15deg)} 90%{transform:rotate(8deg)} 96%{transform:rotate(-4deg)} }
      @keyframes ear-r  { 0%,78%,100%{transform:rotate(0)} 82%{transform:rotate(13deg)}  90%{transform:rotate(-7deg)} 96%{transform:rotate(3deg)} }
      @keyframes blink  { 0%,44%,56%,100%{transform:scaleY(1)} 48%,52%{transform:scaleY(0.07)} }
      @keyframes tail   { 0%,100%{transform:rotate(0)} 30%{transform:rotate(25deg)} 70%{transform:rotate(-25deg)} }
      @keyframes breathe{ 0%,100%{transform:scale(1)} 50%{transform:scaleX(1.012) scaleY(1.018)} }
      @keyframes wh     { 0%,100%{transform:rotate(0)} 50%{transform:rotate(4deg)} }
      @keyframes float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    </style>

    <radialGradient id="gBlack" cx="35%" cy="25%" r="70%">
      <stop offset="0%"   stop-color="#2d2d2d"/>
      <stop offset="55%"  stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <radialGradient id="gWhite" cx="38%" cy="28%" r="65%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="75%"  stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#e4e4e4"/>
    </radialGradient>
    <radialGradient id="gEye" cx="38%" cy="32%" r="62%">
      <stop offset="0%"  stop-color="#4a4a4a"/>
      <stop offset="45%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#090909"/>
    </radialGradient>
    <radialGradient id="gNose" cx="30%" cy="25%" r="70%">
      <stop offset="0%"   stop-color="#ffccdd"/>
      <stop offset="100%" stop-color="#cc4466"/>
    </radialGradient>
    <radialGradient id="gInEar" cx="50%" cy="50%" r="65%">
      <stop offset="0%"   stop-color="#ffaabb"/>
      <stop offset="100%" stop-color="#dd3366"/>
    </radialGradient>
    <radialGradient id="gCheek" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffddee" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#ffbbcc" stop-opacity=".1"/>
    </radialGradient>
    <filter id="drop">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#00000035"/>
    </filter>
  </defs>

  <g class="float">

  <!-- QUEUE -->
  <g class="tail">
    <path d="M152 186 C170 172 186 154 181 130 C178 113 164 108 157 117
             C167 124 172 144 163 165 C158 174 154 183 152 186Z"
          fill="url(#gBlack)"/>
    <ellipse cx="158" cy="117" rx="8" ry="10" fill="url(#gWhite)" transform="rotate(-22,158,117)"/>
  </g>

  <!-- CORPS -->
  <g class="body" filter="url(#drop)">
    <ellipse cx="100" cy="174" rx="54" ry="46" fill="url(#gBlack)"/>
    <!-- plastron blanc -->
    <ellipse cx="99"  cy="180" rx="32" ry="35" fill="url(#gWhite)"/>
    <!-- pattes avant noires arrondies -->
    <ellipse cx="72"  cy="207" rx="20" ry="11" fill="url(#gBlack)"/>
    <ellipse cx="128" cy="207" rx="20" ry="11" fill="url(#gBlack)"/>
    <!-- griffes -->
    <line x1="64" y1="210" x2="62" y2="215" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="71" y1="212" x2="69" y2="217" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="78" y1="210" x2="76" y2="215" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="120" y1="210" x2="118" y2="215" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="127" y1="212" x2="125" y2="217" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="134" y1="210" x2="132" y2="215" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- TÊTE -->
  <g filter="url(#drop)">
    <!-- tête noire grande et très ronde -->
    <circle cx="100" cy="90" r="62" fill="url(#gBlack)"/>

    <!-- joues blanches très rondes caractéristiques de Figaro -->
    <ellipse cx="64"  cy="108" rx="26" ry="22" fill="url(#gWhite)"/>
    <ellipse cx="136" cy="108" rx="26" ry="22" fill="url(#gWhite)"/>

    <!-- museau/menton blanc central -->
    <ellipse cx="100" cy="118" rx="28" ry="22" fill="url(#gWhite)"/>

    <!-- rougeur joues -->
    <ellipse cx="61"  cy="112" rx="14" ry="9" fill="url(#gCheek)"/>
    <ellipse cx="139" cy="112" rx="14" ry="9" fill="url(#gCheek)"/>
  </g>

  <!-- OREILLES -->
  <g class="ear-l">
    <path d="M44 54 L26 10 L74 44 Z" fill="url(#gBlack)" stroke="#050505" stroke-width="1"/>
    <path d="M47 51 L34 18 L70 42 Z" fill="url(#gInEar)" opacity=".9"/>
  </g>
  <g class="ear-r">
    <path d="M156 54 L174 10 L126 44 Z" fill="url(#gBlack)" stroke="#050505" stroke-width="1"/>
    <path d="M153 51 L166 18 L130 42 Z" fill="url(#gInEar)" opacity=".9"/>
  </g>

  <!-- YEUX — grands, ronds, très expressifs -->
  <g class="eye-l">
    <!-- blanc oeil -->
    <ellipse cx="76" cy="88" rx="20" ry="21" fill="white"/>
    <!-- iris sombre -->
    <ellipse cx="76" cy="90" rx="14" ry="16" fill="url(#gEye)"/>
    <!-- reflet principal (gros, blanc) -->
    <circle  cx="68" cy="82" r="6" fill="white" opacity=".95"/>
    <!-- reflet secondaire -->
    <circle  cx="80" cy="99" r="2.5" fill="white" opacity=".55"/>
    <!-- contour épais cartoon -->
    <ellipse cx="76" cy="88" rx="20" ry="21" fill="none" stroke="#080808" stroke-width="3"/>
    <!-- paupière supérieure -->
    <path d="M56 82 Q76 70 96 82" fill="none" stroke="#080808" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g class="eye-r">
    <ellipse cx="124" cy="88" rx="20" ry="21" fill="white"/>
    <ellipse cx="124" cy="90" rx="14" ry="16" fill="url(#gEye)"/>
    <circle  cx="116" cy="82" r="6" fill="white" opacity=".95"/>
    <circle  cx="128" cy="99" r="2.5" fill="white" opacity=".55"/>
    <ellipse cx="124" cy="88" rx="20" ry="21" fill="none" stroke="#080808" stroke-width="3"/>
    <path d="M104 82 Q124 70 144 82" fill="none" stroke="#080808" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- NEZ petit triangle rose -->
  <path d="M96 112 Q100 108 104 112 Q100 117 96 112Z" fill="url(#gNose)" stroke="#aa3355" stroke-width=".6"/>
  <!-- philtrum -->
  <line x1="100" y1="117" x2="100" y2="122" stroke="#cc4466" stroke-width="1.2"/>

  <!-- SOURIRE LARGE ouvert (Figaro) -->
  <!-- arc bas -->
  <path d="M78 122 Q100 144 122 122" fill="white" stroke="#080808" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dents -->
  <path d="M82 122 Q100 136 118 122" fill="white"/>
  <line x1="100" y1="122" x2="100" y2="136" stroke="#e0e0e0" stroke-width="1.2"/>
  <!-- intérieur rose -->
  <path d="M84 124 Q100 134 116 124 Q108 130 100 131 Q92 130 84 124Z" fill="#ffaacc" opacity=".75"/>
  <!-- coins de la bouche -->
  <path d="M78 122 Q72 118 70 114" fill="none" stroke="#080808" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M122 122 Q128 118 130 114" fill="none" stroke="#080808" stroke-width="2.5" stroke-linecap="round"/>

  <!-- MOUSTACHES blanches -->
  <g class="whl">
    <line x1="6"  y1="112" x2="76" y2="116" stroke="white" stroke-width="1.4" opacity=".9"/>
    <line x1="8"  y1="121" x2="76" y2="120" stroke="white" stroke-width="1.4" opacity=".9"/>
    <line x1="10" y1="130" x2="76" y2="124" stroke="white" stroke-width="1.4" opacity=".9"/>
  </g>
  <g class="whr">
    <line x1="124" y1="116" x2="194" y2="112" stroke="white" stroke-width="1.4" opacity=".9"/>
    <line x1="124" y1="120" x2="192" y2="121" stroke="white" stroke-width="1.4" opacity=".9"/>
    <line x1="124" y1="124" x2="190" y2="130" stroke="white" stroke-width="1.4" opacity=".9"/>
  </g>

  </g><!-- end float -->
</svg>
