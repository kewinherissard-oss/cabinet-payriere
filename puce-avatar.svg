<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <style>
      .ear-l  { transform-origin: 52px 40px;  animation: ear-l  5s ease-in-out infinite 1s; }
      .ear-r  { transform-origin: 148px 40px; animation: ear-r  5s ease-in-out infinite 1.4s; }
      .eye-l  { transform-origin: 72px 92px;  animation: blink  5s ease-in-out infinite 2s; }
      .eye-r  { transform-origin: 128px 92px; animation: blink  5s ease-in-out infinite 2s; }
      .tail   { transform-origin: 148px 178px; animation: tail  2.8s ease-in-out infinite; }
      .body   { animation: breathe 3.5s ease-in-out infinite; transform-origin: 100px 165px; }
      .whisL  { transform-origin: 75px 118px; animation: wiskL 3s ease-in-out infinite; }
      .whisR  { transform-origin: 125px 118px; animation: wiskR 3s ease-in-out infinite .6s; }
      .eyebrow-l { transform-origin: 72px 77px; animation: eyebrow 5s ease-in-out infinite 2s; }
      .eyebrow-r { transform-origin: 128px 77px; animation: eyebrow 5s ease-in-out infinite 2s; }

      @keyframes ear-l {
        0%,75%,100%{transform:rotate(0deg)}
        80%{transform:rotate(-14deg)}
        88%{transform:rotate(7deg)}
        94%{transform:rotate(-5deg)}
      }
      @keyframes ear-r {
        0%,75%,100%{transform:rotate(0deg)}
        80%{transform:rotate(12deg)}
        88%{transform:rotate(-6deg)}
        94%{transform:rotate(4deg)}
      }
      @keyframes blink {
        0%,42%,55%,100%{transform:scaleY(1)}
        47%,51%{transform:scaleY(0.06)}
      }
      @keyframes eyebrow {
        0%,42%,55%,100%{transform:translateY(0)}
        47%,51%{transform:translateY(4px)}
      }
      @keyframes tail {
        0%,100%{transform:rotate(0deg)}
        25%{transform:rotate(24deg)}
        75%{transform:rotate(-24deg)}
      }
      @keyframes breathe {
        0%,100%{transform:scaleY(1) scaleX(1)}
        50%{transform:scaleY(1.018) scaleX(1.01)}
      }
      @keyframes wiskL {
        0%,100%{transform:rotate(0deg)}
        50%{transform:rotate(5deg)}
      }
      @keyframes wiskR {
        0%,100%{transform:rotate(0deg)}
        50%{transform:rotate(-5deg)}
      }
    </style>

    <radialGradient id="blackFur" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="whiteFur" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </radialGradient>
    <radialGradient id="eyeWhite" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0ff"/>
    </radialGradient>
    <radialGradient id="iris" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#5cb8ff"/>
      <stop offset="50%" stop-color="#2288dd"/>
      <stop offset="100%" stop-color="#1155aa"/>
    </radialGradient>
    <radialGradient id="noseGrad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffccdd"/>
      <stop offset="100%" stop-color="#cc5577"/>
    </radialGradient>
    <radialGradient id="innerEar" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ff99bb"/>
      <stop offset="100%" stop-color="#cc4466"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffddee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffbbcc" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="softDrop">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#00000030"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- QUEUE -->
  <g class="tail">
    <path d="M148 178 C168 165 182 148 178 126 C175 110 162 106 155 114 C165 120 170 138 162 158 C157 168 152 175 148 178Z"
          fill="url(#blackFur)" stroke="#111" stroke-width="0.5"/>
    <ellipse cx="156" cy="114" rx="7" ry="9" fill="url(#whiteFur)" transform="rotate(-25,156,114)"/>
  </g>

  <!-- CORPS -->
  <g class="body" filter="url(#softDrop)">
    <!-- Corps noir principal -->
    <ellipse cx="100" cy="168" rx="52" ry="46" fill="url(#blackFur)"/>
    <!-- Plastron blanc (ventre) -->
    <ellipse cx="98" cy="175" rx="30" ry="34" fill="url(#whiteFur)"/>
    <!-- Pattes avant -->
    <ellipse cx="74" cy="200" rx="18" ry="11" fill="url(#blackFur)"/>
    <ellipse cx="126" cy="200" rx="18" ry="11" fill="url(#blackFur)"/>
    <!-- Orteils -->
    <ellipse cx="68" cy="203" rx="5" ry="3.5" fill="#222"/>
    <ellipse cx="74" cy="205" rx="5" ry="3.5" fill="#222"/>
    <ellipse cx="80" cy="203" rx="5" ry="3.5" fill="#222"/>
    <ellipse cx="120" cy="203" rx="5" ry="3.5" fill="#222"/>
    <ellipse cx="126" cy="205" rx="5" ry="3.5" fill="#222"/>
    <ellipse cx="132" cy="203" rx="5" ry="3.5" fill="#222"/>
  </g>

  <!-- TÊTE -->
  <g filter="url(#softDrop)">
    <!-- Tête noire grande et ronde (style cartoon) -->
    <circle cx="100" cy="88" r="58" fill="url(#blackFur)"/>
    <!-- Museau blanc large -->
    <ellipse cx="100" cy="108" rx="36" ry="28" fill="url(#whiteFur)"/>
    <!-- Joues blanches rondes caractéristiques -->
    <ellipse cx="62" cy="102" rx="22" ry="18" fill="url(#whiteFur)"/>
    <ellipse cx="138" cy="102" rx="22" ry="18" fill="url(#whiteFur)"/>
    <!-- Rougeur joues -->
    <ellipse cx="60" cy="106" rx="14" ry="9" fill="url(#cheekGrad)"/>
    <ellipse cx="140" cy="106" rx="14" ry="9" fill="url(#cheekGrad)"/>
  </g>

  <!-- OREILLES -->
  <g class="ear-l">
    <path d="M46 52 L28 8 L72 42 Z" fill="url(#blackFur)" stroke="#0d0d0d" stroke-width="1"/>
    <path d="M50 50 L36 18 L67 44 Z" fill="url(#innerEar)" opacity="0.9"/>
  </g>
  <g class="ear-r">
    <path d="M154 52 L172 8 L128 42 Z" fill="url(#blackFur)" stroke="#0d0d0d" stroke-width="1"/>
    <path d="M150 50 L164 18 L133 44 Z" fill="url(#innerEar)" opacity="0.9"/>
  </g>

  <!-- YEUX (grands, expressifs, style Figaro) -->
  <g class="eye-l" filter="url(#glow)">
    <!-- Blanc de l'oeil grand -->
    <ellipse cx="72" cy="90" rx="19" ry="20" fill="url(#eyeWhite)" stroke="#111" stroke-width="1.5"/>
    <!-- Iris bleu -->
    <ellipse cx="72" cy="92" rx="13" ry="14" fill="url(#iris)"/>
    <!-- Pupille noire verticale -->
    <ellipse cx="72" cy="92" rx="6" ry="11" fill="#111"/>
    <!-- Reflets lumineux (style cartoon) -->
    <circle cx="66" cy="86" r="4" fill="white" opacity="0.95"/>
    <circle cx="76" cy="98" r="2" fill="white" opacity="0.6"/>
    <!-- Contour oeil épais cartoon -->
    <ellipse cx="72" cy="90" rx="19" ry="20" fill="none" stroke="#0d0d0d" stroke-width="2.5"/>
    <!-- Cil supérieur style cartoon -->
    <path d="M53 86 Q72 74 91 86" fill="none" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="eye-r" filter="url(#glow)">
    <ellipse cx="128" cy="90" rx="19" ry="20" fill="url(#eyeWhite)" stroke="#111" stroke-width="1.5"/>
    <ellipse cx="128" cy="92" rx="13" ry="14" fill="url(#iris)"/>
    <ellipse cx="128" cy="92" rx="6" ry="11" fill="#111"/>
    <circle cx="122" cy="86" r="4" fill="white" opacity="0.95"/>
    <circle cx="132" cy="98" r="2" fill="white" opacity="0.6"/>
    <ellipse cx="128" cy="90" rx="19" ry="20" fill="none" stroke="#0d0d0d" stroke-width="2.5"/>
    <path d="M109 86 Q128 74 147 86" fill="none" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- SOURCILS (expressifs) -->
  <g class="eyebrow-l">
    <path d="M55 72 Q72 64 88 68" fill="none" stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g class="eyebrow-r">
    <path d="M112 68 Q128 64 145 72" fill="none" stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- NEZ -->
  <ellipse cx="100" cy="112" rx="8" ry="6" fill="url(#noseGrad)" stroke="#aa3355" stroke-width="0.8"/>
  <!-- Philtrum -->
  <line x1="100" y1="118" x2="100" y2="124" stroke="#cc5577" stroke-width="1.2"/>

  <!-- BOUCHE souriante (style cartoon) -->
  <path d="M100 124 Q88 138 78 134" fill="none" stroke="#0d0d0d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100 124 Q112 138 122 134" fill="none" stroke="#0d0d0d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dents visibles sourire -->
  <path d="M85 133 Q100 142 115 133 Q115 128 100 129 Q85 128 85 133Z" fill="white" stroke="#ddd" stroke-width="0.5"/>
  <!-- Intérieur bouche (rose) -->
  <path d="M86 133 Q100 140 114 133 Q107 136 100 137 Q93 136 86 133Z" fill="#ffaacc" opacity="0.7"/>

  <!-- MOUSTACHES GAUCHE -->
  <g class="whisL">
    <line x1="8"  y1="110" x2="72" y2="114" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
    <line x1="10" y1="118" x2="72" y2="118" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
    <line x1="12" y1="126" x2="72" y2="122" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
  </g>
  <!-- MOUSTACHES DROITE -->
  <g class="whisR">
    <line x1="128" y1="114" x2="192" y2="110" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
    <line x1="128" y1="118" x2="190" y2="118" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
    <line x1="128" y1="122" x2="188" y2="126" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
  </g>
</svg>
