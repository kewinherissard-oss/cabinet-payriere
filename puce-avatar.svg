<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 245" width="200" height="223">
<defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; transform-origin: 108px 188px; }
    .tail    { animation: tail-sw 2.8s ease-in-out infinite; transform-origin: 164px 200px; }
    .ear-l   { animation: ear-tw 5s ease-in-out infinite 0.8s; transform-origin: 58px 46px; }
    .ear-r   { animation: ear-tw 5s ease-in-out infinite 1.6s; transform-origin: 162px 46px; }
    .eye-l   { animation: blink  5s ease-in-out infinite; transform-origin: 88px 80px; }
    .eye-r   { animation: blink  5s ease-in-out infinite 0.1s; transform-origin: 132px 80px; }

    @keyframes breathe {
      0%,100% { transform: scaleY(1); }
      50%     { transform: scaleY(1.025); }
    }
    @keyframes tail-sw {
      0%,100% { transform: rotate(0deg); }
      50%     { transform: rotate(14deg); }
    }
    @keyframes ear-tw {
      0%,78%,100% { transform: rotate(0); }
      82% { transform: rotate(-11deg); }
      89% { transform: rotate(6deg); }
      95% { transform: rotate(-3deg); }
    }
    @keyframes blink {
      0%,88%,100% { transform: scaleY(1); }
      92%         { transform: scaleY(0.07); }
    }
  </style>

  <radialGradient id="gWhite" cx="38%" cy="30%" r="65%">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="70%"  stop-color="#f2f2f2"/>
    <stop offset="100%" stop-color="#e0e0e0"/>
  </radialGradient>
  <radialGradient id="gBelly" cx="42%" cy="30%" r="62%">
    <stop offset="0%"  stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f5f5f5"/>
  </radialGradient>
  <radialGradient id="gEyeW" cx="38%" cy="32%" r="64%">
    <stop offset="0%"  stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#eef4ff"/>
  </radialGradient>
  <!-- Yeux ambrés/dorés comme la vraie chatte -->
  <radialGradient id="gIris" cx="30%" cy="24%" r="70%">
    <stop offset="0%"   stop-color="#ffe566"/>
    <stop offset="40%"  stop-color="#c8920a"/>
    <stop offset="75%"  stop-color="#8a5e00"/>
    <stop offset="100%" stop-color="#4a3000"/>
  </radialGradient>
  <radialGradient id="gNose" cx="30%" cy="25%" r="70%">
    <stop offset="0%"  stop-color="#ffcce0"/>
    <stop offset="100%" stop-color="#dd6699"/>
  </radialGradient>
  <radialGradient id="gInEar" cx="50%" cy="48%" r="65%">
    <stop offset="0%"  stop-color="#ffbbcc"/>
    <stop offset="100%" stop-color="#ee6688"/>
  </radialGradient>

  <filter id="f3d">
    <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#00000028"/>
  </filter>
  <filter id="fsoft">
    <feGaussianBlur stdDeviation="1.5" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>

<!-- OMBRE SOL -->
<ellipse cx="110" cy="239" rx="58" ry="6" fill="#00000015"/>

<!-- QUEUE (blanche avec bout noir) -->
<g class="tail">
  <path d="M164 200 C192 188 205 162 196 138
           C190 120 175 118 170 130
           C178 138 182 158 172 176
           C167 188 163 197 164 200Z"
        fill="url(#gWhite)" stroke="#ddd" stroke-width="0.5"/>
  <!-- Tache noire sur la queue -->
  <path d="M180 145 C188 136 192 126 186 120
           C182 116 175 118 172 126
           C176 132 180 140 180 145Z"
        fill="#1c1c1c"/>
  <!-- Bout blanc queue -->
  <ellipse cx="171" cy="131" rx="8" ry="11" fill="url(#gBelly)" transform="rotate(-18,171,131)"/>
</g>

<!-- CORPS -->
<g class="breathe" filter="url(#f3d)">
  <!-- Corps blanc de base -->
  <ellipse cx="108" cy="188" rx="64" ry="52" fill="url(#gWhite)"/>

  <!-- Grande tache noire dorsale (dos + côté droit) -->
  <path d="M118 142 C134 136 158 140 168 156
           C176 168 174 184 166 192
           C156 200 142 202 130 198
           C118 194 112 182 114 168
           C116 156 116 148 118 142Z"
        fill="#1c1c1c"/>

  <!-- Petite tache noire côté gauche corps -->
  <path d="M60 172 C56 162 58 154 66 152
           C74 150 80 158 78 168
           C76 176 68 180 60 172Z"
        fill="#1c1c1c"/>

  <!-- Ventre blanc propre par-dessus les taches -->
  <ellipse cx="104" cy="197" rx="44" ry="37" fill="url(#gBelly)"/>
  <!-- Highlight -->
  <ellipse cx="82" cy="168" rx="24" ry="14" fill="white" opacity="0.55"/>
</g>

<!-- PATTES AVANT blanches -->
<ellipse cx="82" cy="226" rx="22" ry="13" fill="url(#gWhite)" filter="url(#f3d)"/>
<ellipse cx="80" cy="223" rx="19" ry="11" fill="url(#gBelly)"/>
<ellipse cx="136" cy="226" rx="22" ry="13" fill="url(#gWhite)" filter="url(#f3d)"/>
<ellipse cx="138" cy="223" rx="19" ry="11" fill="url(#gBelly)"/>

<!-- TÊTE -->
<g filter="url(#f3d)">
  <!-- Joues bouffies blanches -->
  <ellipse cx="46" cy="100" rx="26" ry="20" fill="url(#gWhite)"/>
  <ellipse cx="174" cy="100" rx="26" ry="20" fill="url(#gWhite)"/>

  <!-- Tête blanche ronde -->
  <circle cx="110" cy="82" r="60" fill="url(#gWhite)"/>

  <!-- Grande tache noire dessus de tête -->
  <path d="M76 28 C88 14 108 10 128 16
           C144 22 152 36 148 52
           C144 64 132 70 116 70
           C98 70 82 62 76 48
           C72 40 72 34 76 28Z"
        fill="#1c1c1c"/>

  <!-- Tache noire sur l oreille gauche / tempe gauche -->
  <path d="M50 56 C44 46 40 56 42 68
           C44 78 54 82 62 76
           C68 70 64 56 50 56Z"
        fill="#1c1c1c"/>

  <!-- OREILLES -->
  <g class="ear-l">
    <!-- Oreille gauche noire (dans la tache) -->
    <path d="M52 52 L34 5 L90 36 Z" fill="#1c1c1c" stroke="#333" stroke-width="0.5"/>
    <path d="M55 50 L42 12 L87 37 Z" fill="url(#gInEar)" opacity="0.85"/>
  </g>
  <g class="ear-r">
    <!-- Oreille droite blanche (hors tache) -->
    <path d="M168 52 L186 5 L130 36 Z" fill="url(#gWhite)" stroke="#ccc" stroke-width="0.5"/>
    <path d="M165 50 L178 12 L133 37 Z" fill="url(#gInEar)" opacity="0.85"/>
  </g>

  <!-- Visage blanc (par-dessus les taches, zone museau/joues) -->
  <ellipse cx="110" cy="102" rx="38" ry="30" fill="url(#gBelly)" opacity="0.96"/>

  <!-- Highlight tête -->
  <ellipse cx="116" cy="60" rx="18" ry="10" fill="#3a3a3a" opacity="0.18"/>

  <!-- OEIL GAUCHE (à la frontière tache/blanc) -->
  <g class="eye-l">
    <ellipse cx="88" cy="80" rx="17" ry="18" fill="url(#gEyeW)" stroke="#888" stroke-width="1"/>
    <ellipse cx="88" cy="81" rx="13" ry="14" fill="url(#gIris)"/>
    <ellipse cx="88" cy="81" rx="6.5" ry="8.5" fill="#0e0800"/>
    <circle  cx="81" cy="73" r="5.5" fill="white" opacity="0.95"/>
    <circle  cx="92" cy="87" r="2.2" fill="white" opacity="0.5"/>
    <ellipse cx="88" cy="80" rx="17" ry="18" fill="none" stroke="#333" stroke-width="1.8"/>
    <path d="M71 71 Q88 58 105 71" fill="none" stroke="#222" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- OEIL DROIT -->
  <g class="eye-r">
    <ellipse cx="132" cy="80" rx="17" ry="18" fill="url(#gEyeW)" stroke="#888" stroke-width="1"/>
    <ellipse cx="132" cy="81" rx="13" ry="14" fill="url(#gIris)"/>
    <ellipse cx="132" cy="81" rx="6.5" ry="8.5" fill="#0e0800"/>
    <circle  cx="125" cy="73" r="5.5" fill="white" opacity="0.95"/>
    <circle  cx="136" cy="87" r="2.2" fill="white" opacity="0.5"/>
    <ellipse cx="132" cy="80" rx="17" ry="18" fill="none" stroke="#333" stroke-width="1.8"/>
    <path d="M115 71 Q132 58 149 71" fill="none" stroke="#222" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- NEZ rose -->
  <path d="M106 106 Q110 100 114 106 Q110 112 106 106Z" fill="url(#gNose)" stroke="#bb4466" stroke-width="0.7"/>
  <line x1="110" y1="112" x2="110" y2="118" stroke="#cc5577" stroke-width="1.2"/>
  <!-- Sourire doux -->
  <path d="M110 118 Q103 126 97 124" fill="none" stroke="#446688" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M110 118 Q117 126 123 124" fill="none" stroke="#446688" stroke-width="2.2" stroke-linecap="round"/>

  <!-- MOUSTACHES blanches -->
  <line x1="10"  y1="104" x2="78"  y2="108" stroke="white" stroke-width="1.4" opacity="0.9"/>
  <line x1="12"  y1="112" x2="78"  y2="112" stroke="white" stroke-width="1.4" opacity="0.9"/>
  <line x1="12"  y1="120" x2="78"  y2="116" stroke="white" stroke-width="1.4" opacity="0.9"/>
  <line x1="142" y1="108" x2="210" y2="104" stroke="white" stroke-width="1.4" opacity="0.9"/>
  <line x1="142" y1="112" x2="208" y2="112" stroke="white" stroke-width="1.4" opacity="0.9"/>
  <line x1="142" y1="116" x2="208" y2="120" stroke="white" stroke-width="1.4" opacity="0.9"/>
</g>

</svg>
