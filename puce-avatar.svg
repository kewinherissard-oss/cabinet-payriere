<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .ear-left  { transform-origin: 28px 22px; animation: ear-twitch 4s ease-in-out infinite; }
      .ear-right { transform-origin: 72px 22px; animation: ear-twitch 4s ease-in-out infinite 0.3s; }
      .eye-left  { animation: blink 5s ease-in-out infinite 1s; transform-origin: 37px 50px; }
      .eye-right { animation: blink 5s ease-in-out infinite 1s; transform-origin: 63px 50px; }
      .pupil-l   { animation: blink 5s ease-in-out infinite 1s; transform-origin: 37px 50px; }
      .pupil-r   { animation: blink 5s ease-in-out infinite 1s; transform-origin: 63px 50px; }
      .tail      { transform-origin: 82px 78px; animation: tail-wave 2.5s ease-in-out infinite; }
      .whisker-l { animation: whisker-move 3s ease-in-out infinite; transform-origin: 50px 60px; }
      .whisker-r { animation: whisker-move 3s ease-in-out infinite 0.5s; transform-origin: 50px 60px; }
      .body      { animation: breathe 3s ease-in-out infinite; transform-origin: 50px 70px; }

      @keyframes ear-twitch {
        0%,85%,100% { transform: rotate(0deg); }
        88%         { transform: rotate(-8deg); }
        92%         { transform: rotate(5deg); }
        96%         { transform: rotate(-4deg); }
      }
      @keyframes blink {
        0%,44%,54%,100% { transform: scaleY(1); }
        48%,50%         { transform: scaleY(0.05); }
      }
      @keyframes tail-wave {
        0%,100% { transform: rotate(0deg); }
        25%     { transform: rotate(18deg); }
        75%     { transform: rotate(-18deg); }
      }
      @keyframes whisker-move {
        0%,100% { transform: rotate(0deg); }
        50%     { transform: rotate(3deg); }
      }
      @keyframes breathe {
        0%,100% { transform: scaleY(1); }
        50%     { transform: scaleY(1.02); }
      }
    </style>
    <radialGradient id="bodyGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#c08000"/>
    </radialGradient>
    <radialGradient id="noseGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffaaaa"/>
      <stop offset="100%" stop-color="#e06080"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- TAIL -->
  <g class="tail">
    <path d="M78 82 Q95 70 92 55 Q90 45 85 50 Q88 60 82 72 Q79 78 78 82Z"
          fill="#1a1a1a" stroke="#111" stroke-width="0.3"/>
    <path d="M85 50 Q91 44 88 48 Q90 45 85 50Z" fill="#fff" stroke="none"/>
  </g>

  <!-- BODY -->
  <g class="body" filter="url(#shadow)">
    <!-- white main body -->
    <ellipse cx="50" cy="74" rx="26" ry="20" fill="url(#bodyGrad)"/>
    <!-- black patch on back -->
    <ellipse cx="60" cy="68" rx="14" ry="10" fill="#1a1a1a"/>
    <ellipse cx="58" cy="66" rx="12" ry="8" fill="#222"/>
    <!-- front paws -->
    <ellipse cx="40" cy="90" rx="7" ry="4" fill="#f0f0f0"/>
    <ellipse cx="60" cy="90" rx="7" ry="4" fill="#f0f0f0"/>
    <!-- paw toes -->
    <circle cx="37" cy="91" r="1.5" fill="#ddd"/>
    <circle cx="40" cy="92" r="1.5" fill="#ddd"/>
    <circle cx="43" cy="91" r="1.5" fill="#ddd"/>
    <circle cx="57" cy="91" r="1.5" fill="#ddd"/>
    <circle cx="60" cy="92" r="1.5" fill="#ddd"/>
    <circle cx="63" cy="91" r="1.5" fill="#ddd"/>
  </g>

  <!-- HEAD -->
  <g filter="url(#shadow)">
    <!-- head white base -->
    <ellipse cx="50" cy="46" rx="22" ry="20" fill="#f8f8f8"/>
    <!-- black cap on top of head -->
    <ellipse cx="50" cy="34" rx="17" ry="13" fill="#1a1a1a"/>
    <ellipse cx="50" cy="38" rx="15" ry="10" fill="#222"/>
    <!-- cheeks white -->
    <ellipse cx="36" cy="52" rx="8" ry="6" fill="#f5f5f5"/>
    <ellipse cx="64" cy="52" rx="8" ry="6" fill="#f5f5f5"/>
  </g>

  <!-- EARS -->
  <g class="ear-left">
    <polygon points="20,28 30,8 38,28" fill="#1a1a1a"/>
    <polygon points="23,26 30,12 37,26" fill="#c06070"/>
  </g>
  <g class="ear-right">
    <polygon points="62,28 70,8 80,28" fill="#1a1a1a"/>
    <polygon points="63,26 70,12 77,26" fill="#c06070"/>
  </g>

  <!-- EYES -->
  <g class="eye-left">
    <circle cx="37" cy="50" r="7" fill="url(#eyeGrad)"/>
    <circle cx="37" cy="50" r="3.5" fill="#1a1a1a" class="pupil-l"/>
    <circle cx="35" cy="48" r="1.5" fill="white" opacity="0.8"/>
  </g>
  <g class="eye-right">
    <circle cx="63" cy="50" r="7" fill="url(#eyeGrad)"/>
    <circle cx="63" cy="50" r="3.5" fill="#1a1a1a" class="pupil-r"/>
    <circle cx="61" cy="48" r="1.5" fill="white" opacity="0.8"/>
  </g>

  <!-- NOSE -->
  <path d="M48 60 Q50 58 52 60 Q50 63 48 60Z" fill="url(#noseGrad)"/>
  <!-- mouth -->
  <path d="M50 62 Q47 65 44 64" fill="none" stroke="#c06070" stroke-width="1" stroke-linecap="round"/>
  <path d="M50 62 Q53 65 56 64" fill="none" stroke="#c06070" stroke-width="1" stroke-linecap="round"/>

  <!-- WHISKERS LEFT -->
  <g class="whisker-l">
    <line x1="14" y1="57" x2="44" y2="58" stroke="#888" stroke-width="0.8" opacity="0.7"/>
    <line x1="16" y1="61" x2="44" y2="61" stroke="#888" stroke-width="0.8" opacity="0.7"/>
    <line x1="18" y1="65" x2="44" y2="63" stroke="#888" stroke-width="0.8" opacity="0.7"/>
  </g>
  <!-- WHISKERS RIGHT -->
  <g class="whisker-r">
    <line x1="56" y1="58" x2="86" y2="57" stroke="#888" stroke-width="0.8" opacity="0.7"/>
    <line x1="56" y1="61" x2="84" y2="61" stroke="#888" stroke-width="0.8" opacity="0.7"/>
    <line x1="56" y1="63" x2="82" y2="65" stroke="#888" stroke-width="0.8" opacity="0.7"/>
  </g>
</svg>
