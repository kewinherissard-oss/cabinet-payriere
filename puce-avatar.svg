<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <style>
      .ear-l { transform-origin: 38px 38px; animation: ear-l 6s ease-in-out infinite 2s; }
      .ear-r { transform-origin: 122px 38px; animation: ear-r 6s ease-in-out infinite 2.4s; }
      .eye-l-group { transform-origin: 57px 88px; animation: blink 6s ease-in-out infinite 1s; }
      .eye-r-group { transform-origin: 103px 88px; animation: blink 6s ease-in-out infinite 1s; }
      .tail { transform-origin: 118px 168px; animation: tail 3s ease-in-out infinite; }
      .body { animation: breathe 4s ease-in-out infinite; transform-origin: 80px 150px; }
      .whisker-l { animation: wisk-l 4s ease-in-out infinite; transform-origin: 60px 110px; }
      .whisker-r { animation: wisk-r 4s ease-in-out infinite 0.5s; transform-origin: 100px 110px; }

      @keyframes ear-l {
        0%,80%,100%{ transform:rotate(0deg) }
        84%{ transform:rotate(-12deg) }
        90%{ transform:rotate(6deg) }
        95%{ transform:rotate(-5deg) }
      }
      @keyframes ear-r {
        0%,80%,100%{ transform:rotate(0deg) }
        84%{ transform:rotate(10deg) }
        90%{ transform:rotate(-6deg) }
        95%{ transform:rotate(4deg) }
      }
      @keyframes blink {
        0%,40%,55%,100%{ transform:scaleY(1) }
        46%,50%{ transform:scaleY(0.06) }
      }
      @keyframes tail {
        0%,100%{ transform:rotate(0deg) }
        30%{ transform:rotate(22deg) }
        70%{ transform:rotate(-22deg) }
      }
      @keyframes breathe {
        0%,100%{ transform:scaleY(1) scaleX(1) }
        50%{ transform:scaleY(1.015) scaleX(1.008) }
      }
      @keyframes wisk-l {
        0%,100%{ transform:rotate(0deg) }
        50%{ transform:rotate(4deg) }
      }
      @keyframes wisk-r {
        0%,100%{ transform:rotate(0deg) }
        50%{ transform:rotate(-4deg) }
      }
    </style>

    <!-- Fur gradients -->
    <radialGradient id="bodyWhite" cx="42%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2f2f2"/>
      <stop offset="100%" stop-color="#ddd"/>
    </radialGradient>
    <radialGradient id="blackPatch" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <radialGradient id="eyeAmber" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#e0a020"/>
      <stop offset="100%" stop-color="#a06010"/>
    </radialGradient>
    <radialGradient id="eyeAmber2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#e0a020"/>
      <stop offset="100%" stop-color="#a06010"/>
    </radialGradient>
    <radialGradient id="noseGrad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffbbd0"/>
      <stop offset="100%" stop-color="#d06080"/>
    </radialGradient>
    <radialGradient id="innerEarGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f4a0b0"/>
      <stop offset="100%" stop-color="#d07090"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </radialGradient>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#00000028"/>
    </filter>
    <filter id="furBlur">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- TAIL -->
  <g class="tail">
    <path d="M118 170 C135 162 148 148 144 128 C141 112 130 108 124 116 C132 122 136 138 128 152 C124 162 120 168 118 170Z"
          fill="#1a1a1a"/>
    <!-- tail tip white -->
    <ellipse cx="124" cy="116" rx="5" ry="7" fill="#f0f0f0" transform="rotate(-20,124,116)"/>
  </g>

  <!-- BODY -->
  <g class="body" filter="url(#softShadow)">
    <!-- Main white body -->
    <ellipse cx="80" cy="155" rx="42" ry="38" fill="url(#bodyWhite)"/>
    <!-- Black saddle patch on back -->
    <path d="M52 138 C52 128 58 122 68 120 C78 118 92 118 102 122 C112 126 116 132 114 142 C110 134 104 129 92 127 C80 125 68 126 58 133Z"
          fill="#1a1a1a"/>
    <!-- White belly -->
    <ellipse cx="78" cy="162" rx="28" ry="22" fill="url(#bellyGrad)"/>
    <!-- Front paws -->
    <ellipse cx="63" cy="185" rx="14" ry="9" fill="#f5f5f5"/>
    <ellipse cx="97" cy="185" rx="14" ry="9" fill="#f5f5f5"/>
    <!-- Paw dividers -->
    <line x1="59" y1="187" x2="59" y2="192" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
    <line x1="63" y1="188" x2="63" y2="193" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
    <line x1="67" y1="187" x2="67" y2="192" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
    <line x1="93" y1="187" x2="93" y2="192" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
    <line x1="97" y1="188" x2="97" y2="193" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
    <line x1="101" y1="187" x2="101" y2="192" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- HEAD -->
  <g filter="url(#softShadow)">
    <!-- Head base white -->
    <ellipse cx="80" cy="80" rx="38" ry="35" fill="#f8f8f8"/>
    <!-- Black cap covering top half of head -->
    <path d="M42 72 C42 54 58 42 80 42 C102 42 118 54 118 72 C114 66 104 60 80 60 C56 60 46 66 42 72Z"
          fill="#1a1a1a"/>
    <ellipse cx="80" cy="64" rx="32" ry="20" fill="#222"/>
    <!-- White cheeks slightly raised -->
    <ellipse cx="52" cy="90" rx="16" ry="12" fill="#f5f5f5"/>
    <ellipse cx="108" cy="90" rx="16" ry="12" fill="#f5f5f5"/>
    <!-- Chin white -->
    <ellipse cx="80" cy="105" rx="20" ry="10" fill="#ffffff"/>
  </g>

  <!-- EARS -->
  <g class="ear-l">
    <!-- outer ear black -->
    <path d="M34 62 L22 22 L56 46 Z" fill="#1a1a1a"/>
    <!-- inner ear pink -->
    <path d="M36 58 L28 30 L52 48 Z" fill="url(#innerEarGrad)" opacity="0.85"/>
  </g>
  <g class="ear-r">
    <!-- outer ear black -->
    <path d="M126 62 L138 22 L104 46 Z" fill="#1a1a1a"/>
    <!-- inner ear pink -->
    <path d="M124 58 L132 30 L108 48 Z" fill="url(#innerEarGrad)" opacity="0.85"/>
  </g>

  <!-- EYES -->
  <g class="eye-l-group">
    <!-- eye white -->
    <ellipse cx="57" cy="88" rx="12" ry="10" fill="url(#eyeAmber)"/>
    <!-- pupil vertical slit -->
    <ellipse cx="57" cy="88" rx="5" ry="8" fill="#111"/>
    <!-- pupil shine -->
    <circle cx="54" cy="85" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="60" cy="91" r="1.2" fill="white" opacity="0.5"/>
    <!-- eyelid top -->
    <path d="M45 88 Q57 80 69 88" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g class="eye-r-group">
    <!-- eye white -->
    <ellipse cx="103" cy="88" rx="12" ry="10" fill="url(#eyeAmber2)"/>
    <!-- pupil vertical slit -->
    <ellipse cx="103" cy="88" rx="5" ry="8" fill="#111"/>
    <!-- pupil shine -->
    <circle cx="100" cy="85" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="106" cy="91" r="1.2" fill="white" opacity="0.5"/>
    <!-- eyelid top -->
    <path d="M91 88 Q103 80 115 88" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- NOSE -->
  <path d="M77 105 Q80 102 83 105 Q80 109 77 105Z" fill="url(#noseGrad)"/>
  <!-- Philtrum -->
  <line x1="80" y1="108" x2="80" y2="112" stroke="#d08090" stroke-width="0.8"/>
  <!-- Mouth -->
  <path d="M80 112 Q74 118 70 116" fill="none" stroke="#c07080" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M80 112 Q86 118 90 116" fill="none" stroke="#c07080" stroke-width="1.2" stroke-linecap="round"/>

  <!-- WHISKERS LEFT -->
  <g class="whisker-l">
    <line x1="8"  y1="100" x2="64" y2="105" stroke="#aaa" stroke-width="0.9" opacity="0.8"/>
    <line x1="10" y1="108" x2="64" y2="108" stroke="#aaa" stroke-width="0.9" opacity="0.8"/>
    <line x1="12" y1="116" x2="64" y2="111" stroke="#aaa" stroke-width="0.9" opacity="0.8"/>
  </g>
  <!-- WHISKERS RIGHT -->
  <g class="whisker-r">
    <line x1="96" y1="105" x2="152" y2="100" stroke="#aaa" stroke-width="0.9" opacity="0.8"/>
    <line x1="96" y1="108" x2="150" y2="108" stroke="#aaa" stroke-width="0.9" opacity="0.8"/>
    <line x1="96" y1="111" x2="148" y2="116" stroke="#aaa" stroke-width="0.9" opacity="0.8"/>
  </g>

  <!-- Forehead fur detail lines -->
  <path d="M72 50 Q75 44 80 42" fill="none" stroke="#333" stroke-width="0.6" opacity="0.5"/>
  <path d="M88 50 Q85 44 80 42" fill="none" stroke="#333" stroke-width="0.6" opacity="0.5"/>
</svg>
